name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 fonts-dejavu-core binutils squashfs-tools file xvfb
      - run: python -m pip install -r requirements.txt
      - name: AppImage tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$HOME/.local/bin/appimagetool"
          curl -fL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o "$HOME/.local/bin/runtime-x86_64"
          chmod +x "$HOME/.local/bin/appimagetool" "$HOME/.local/bin/runtime-x86_64"
      - name: Build and validate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          APPIMAGE_EXTRACT_AND_RUN=1 tools/build_appimage.sh
          image=$(find package -name '*.AppImage' -type f | head -1)
          xvfb-run -a "$image" --smoke-test-report "$PWD/test_reports/ubuntu_xcb_smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-and-reports
          path: |
            package/*.AppImage*
            test_reports/
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - name: Verify native header painting
        run: python -m unittest discover -s tests -p test_header_bom_layout.py -v
        env:
          PYTHONUTF8: '1'
      - run: python tools/build_windows.py
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe-and-reports
          path: |
            package/*.exe*
            test_reports/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-and-reports
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-and-reports
          path: release-assets/windows
      - name: Create release and upload validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE_${RELEASE_TAG}.md"
          test -s "$notes"
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.sha256' \) -print0)
          test "${#assets[@]}" -ge 2
          gh release create "$RELEASE_TAG" --verify-tag --title "BOM管理系统 ${RELEASE_TAG}" --notes-file "$notes" "${assets[@]}"
